apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappruntimes.platform.schonfeld.manas.dev
spec:
  group: platform.schonfeld.manas.dev
  names:
    kind: XAppRuntime
    plural: xappruntimes
  claimNames:
    kind: AppRuntime
    plural: appruntimes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appName:
                  type: string
                bucketName:
                  type: string
                dbName:
                  type: string
                replicas:
                  type: integer
                  default: 2
                cpuLimit:
                  type: string
                  default: 500m
                memoryLimit:
                  type: string
                  default: 512Mi
                storageSize:
                  type: string
                  default: 1Gi
                maxTTLDays:
                  type: integer
                  default: 30
              required:
                - appName
                - bucketName
                - dbName
            status:
              type: object
              properties:
                namespace:
                  type: string
